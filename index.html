<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Puzzle Arena</title>
    <meta name="description" content="An arcade-style word puzzle game with drag-and-drop mechanics">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>WORD PUZZLE ARENA</h1>
            <div class="game-info">
                <div class="level-info">
                    <span id="current-level">Level: 1</span>
                    <span id="words-left">Words: 0/0</span>
                </div>
                <div class="score-info">
                    <span id="score-display">Score: 0</span>
                    <span id="streak-display">Streak: 0</span>
                </div>
            </div>
        </header>

        <main class="game-main">
            <div class="word-display" id="word-display" role="grid" aria-label="Word puzzle drop zones">
                <!-- Drop zones will be generated by JavaScript -->
            </div>

            <div class="letter-container" id="letter-container" role="group" aria-label="Draggable letters">
                <!-- Draggable letters will be generated by JavaScript -->
            </div>

            <div class="controls">
                <button id="hint-btn" class="btn" aria-label="Get hint for current word">Hint</button>
                <button id="settings-btn" class="btn" aria-label="Open settings">Settings</button>
                <button id="restart-btn" class="btn" aria-label="Restart current level">Restart</button>
            </div>
        </main>

        <div class="timer-container">
            <div class="timer-bar" id="timer-bar"></div>
            <div class="timer-text" id="timer-text">30</div>
        </div>

        <div class="game-status" id="game-status" role="alert" aria-live="assertive">
            <!-- Game status messages will appear here -->
        </div>

        <div class="modal" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="modal-content">
                <h2 id="settings-title">Settings</h2>
                <form id="settings-form">
                    <div class="form-group">
                        <label for="level-length">Words per Level:</label>
                        <input type="number" id="level-length" min="6" max="20" required>
                    </div>

                    <div class="form-group">
                        <label>Audio:</label>
                        <div class="toggle-group">
                            <label class="toggle-switch">
                                <input type="checkbox" id="music-toggle" checked>
                                <span class="slider"></span>
                                <span class="toggle-label">Music</span>
                            </label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="sfx-toggle" checked>
                                <span class="slider"></span>
                                <span class="toggle-label">Sound Effects</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="toggle-switch">
                            <input type="checkbox" id="reduced-motion">
                            <span class="slider"></span>
                            <span class="toggle-label">Reduced Motion</span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="close-settings" class="btn">Close</button>
                        <button type="submit" class="btn">Save</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal" id="results-modal" role="dialog" aria-modal="true" aria-labelledby="results-title">
            <div class="modal-content">
                <h2 id="results-title">Level Complete!</h2>
                <div class="results-stats">
                    <div class="stat">
                        <span class="stat-label">Words Solved:</span>
                        <span class="stat-value" id="solved-count">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Words Missed:</span>
                        <span class="stat-value" id="missed-count">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Accuracy:</span>
                        <span class="stat-value" id="accuracy">0%</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Score:</span>
                        <span class="stat-value" id="total-score">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Best Streak:</span>
                        <span class="stat-value" id="best-streak">0</span>
                    </div>
                </div>
                <div class="form-actions">
                    <button id="next-level-btn" class="btn">Next Level</button>
                    <button id="restart-level-btn" class="btn">Restart Level</button>
                </div>
            </div>
        </div>

        <div class="modal" id="game-over-modal" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
            <div class="modal-content">
                <h2 id="game-over-title">Game Over</h2>
                <p id="game-over-message">You didn't complete the level.</p>
                <div class="form-actions">
                    <button id="play-again-btn" class="btn">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="background-music" loop>
        <source src="audio/background.mp3" type="audio/mpeg">
        <source src="audio/background.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <audio id="correct-sfx">
        <source src="audio/correct.mp3" type="audio/mpeg">
        <source src="audio/correct.ogg" type="audio/ogg">
    </audio>

    <audio id="incorrect-sfx">
        <source src="audio/incorrect.mp3" type="audio/mpeg">
        <source src="audio/incorrect.ogg" type="audio/ogg">
    </audio>

    <audio id="timer-alert-sfx">
        <source src="audio/timer-alert.mp3" type="audio/mpeg">
        <source src="audio/timer-alert.ogg" type="audio/ogg">
    </audio>

    <script src="wordlist.js"></script>
    <script src="script.js"></script>
</body>
</html>
