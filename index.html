<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble Puzzle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🧩</text></svg>">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Word Scramble</h1>
            <div class="game-info">
                <div class="timer">Time: <span id="time-left">60</span>s</div>
                <div class="score">Score: <span id="score">0</span></div>
                <div class="streak">Streak: <span id="streak">0</span></div>
            </div>
        </header>

        <main>
            <div class="puzzle-container">
                <div class="scrambled-word" id="scrambled-word"></div>
                <div class="word-input">
                    <input type="text" id="user-guess" placeholder="Enter your guess" autocomplete="off">
                    <button id="submit-guess">Submit</button>
                </div>
            </div>

            <div class="word-list">
                <h3>Words to Find:</h3>
                <ul id="word-list"></ul>
            </div>
        </main>

        <div class="controls">
            <button id="hint-btn">Get Hint</button>
            <button id="new-game-btn">New Game</button>
            <button id="settings-btn">Settings</button>
        </div>

        <div class="settings-panel" id="settings-panel">
            <h2>Settings</h2>
            <div class="setting">
                <label for="word-count">Words per level:</label>
                <input type="number" id="word-count" min="6" max="20" value="10">
            </div>
            <div class="setting">
                <label>
                    <input type="checkbox" id="music-toggle"> Enable Music
                </label>
            </div>
            <div class="setting">
                <label>
                    <input type="checkbox" id="sfx-toggle"> Enable Sound Effects
                </label>
            </div>
            <button id="save-settings">Save</button>
            <button id="close-settings">Close</button>
        </div>

        <div class="results-panel" id="results-panel">
            <h2>Game Results</h2>
            <div class="results-stats">
                <p>Words Found: <span id="words-found">0</span>/<span id="total-words">0</span></p>
                <p>Accuracy: <span id="accuracy">0</span>%</p>
                <p>Score: <span id="final-score">0</span></p>
                <p>Best Streak: <span id="best-streak">0</span></p>
            </div>
            <div class="missed-words">
                <h3>Missed Words:</h3>
                <ul id="missed-words-list"></ul>
            </div>
            <button id="play-again">Play Again</button>
        </div>
    </div>

    <audio id="tick-sound" src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU..." preload="auto"></audio>
    <audio id="success-sound" src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU..." preload="auto"></audio>
    <audio id="fail-sound" src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU..." preload="auto"></audio>
    <audio id="background-music" loop src="data:audio/mp3;base64,SUQzBAAAAAAAUlRTUwAAAAtIZXRhbGluZSBhdWRpbwAAAAA..." preload="auto"></audio>

    <script src="wordlist.js"></script>
    <script src="script.js"></script>
</body>
</html>
